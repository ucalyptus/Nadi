<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Nadi Four-Tier Architecture</title>
  <desc id="desc">Nadi architecture showing external clients, stateless gateway, broker control plane, celld session tier, sandboxd execution tier, Postgres, GCS, credentials proxy, and gitd.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#fbbf24"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .bg{fill:#020617}.grid{fill:url(#grid)}
      .title{font:700 28px 'JetBrains Mono',Consolas,monospace;fill:#e2e8f0}.subtitle{font:13px 'JetBrains Mono',Consolas,monospace;fill:#94a3b8}
      .box-bg{fill:#0f172a}.label{font:700 14px 'JetBrains Mono',Consolas,monospace;fill:#f8fafc}.sub{font:10px 'JetBrains Mono',Consolas,monospace;fill:#cbd5e1}.tiny{font:9px 'JetBrains Mono',Consolas,monospace;fill:#94a3b8}
      .external{fill:rgba(30,41,59,.64);stroke:#94a3b8;stroke-width:1.5}.frontend{fill:rgba(8,51,68,.46);stroke:#22d3ee;stroke-width:1.5}.backend{fill:rgba(6,78,59,.46);stroke:#34d399;stroke-width:1.5}.db{fill:rgba(76,29,149,.46);stroke:#a78bfa;stroke-width:1.5}.cloud{fill:rgba(120,53,15,.36);stroke:#fbbf24;stroke-width:1.5}.security{fill:rgba(136,19,55,.42);stroke:#fb7185;stroke-width:1.5}
      .boundary{fill:none;stroke:#475569;stroke-width:1.2;stroke-dasharray:8 5}.boundary-label{font:700 11px 'JetBrains Mono',Consolas,monospace;fill:#cbd5e1}
      .cyan{stroke:#22d3ee;stroke-width:2.4;fill:none;marker-end:url(#arrow-cyan)}.green{stroke:#34d399;stroke-width:2.2;fill:none;marker-end:url(#arrow-green)}.purple{stroke:#a78bfa;stroke-width:2.2;fill:none;marker-end:url(#arrow-purple)}.amber{stroke:#fbbf24;stroke-width:2.3;fill:none;marker-end:url(#arrow-amber)}.dash{stroke-dasharray:8 6}.flow{font:10px 'JetBrains Mono',Consolas,monospace;fill:#cbd5e1}.legend{font:10px 'JetBrains Mono',Consolas,monospace;fill:#cbd5e1}
    </style>
  </defs>
  <rect class="bg" width="1280" height="760"/>
  <rect class="grid" width="1280" height="760" opacity="0.7"/>
  <text x="40" y="48" class="title">Nadi Architecture</text>
  <text x="40" y="72" class="subtitle">Postgres-centric, four-tier session runtime for agent workloads</text>

  <!-- boundaries -->
  <rect x="30" y="100" width="1220" height="570" rx="16" class="boundary"/>
  <text x="48" y="123" class="boundary-label">Cloud VPC / isolated tier subnets</text>
  <rect x="320" y="150" width="675" height="455" rx="14" class="boundary" opacity="0.75"/>
  <text x="338" y="174" class="boundary-label">Nadi Control + Session Plane</text>

  <!-- arrows behind boxes -->
  <path class="cyan" d="M210 250 C260 250 275 250 320 250"/>
  <text x="230" y="238" class="flow">REST / ACP / SSE</text>
  <path class="cyan" d="M470 250 C575 250 610 250 690 250"/>
  <text x="520" y="238" class="flow">session traffic</text>
  <path class="green" d="M420 310 C460 385 520 418 610 418"/>
  <text x="452" y="373" class="flow">new session lifecycle</text>
  <path class="green dash" d="M760 395 C800 350 800 315 760 305"/>
  <text x="783" y="350" class="flow">WS /ws create_cell</text>
  <path class="green dash" d="M790 450 C870 500 925 510 1010 505"/>
  <text x="855" y="492" class="flow">WS /ws capacity</text>
  <path class="amber" d="M860 270 C940 270 970 270 1020 270"/>
  <text x="894" y="258" class="flow">direct tool RPC</text>
  <path class="purple" d="M425 205 C540 120 720 120 875 205"/>
  <text x="568" y="126" class="flow">read routing + command state</text>
  <path class="purple" d="M775 205 C820 170 855 170 895 205"/>
  <text x="790" y="178" class="flow">events / leases</text>
  <path class="amber dash" d="M1120 345 C1120 430 1120 505 1120 560"/>
  <text x="1135" y="455" class="flow">BTRFS snapshots</text>
  <path class="amber" d="M1105 300 C1095 380 1050 415 985 430"/>
  <text x="1000" y="386" class="flow">JWT → scoped token</text>

  <!-- external clients -->
  <rect x="55" y="190" width="155" height="120" rx="8" class="box-bg"/>
  <rect x="55" y="190" width="155" height="120" rx="8" class="external"/>
  <text x="76" y="220" class="label">External Clients</text>
  <text x="76" y="244" class="sub">Slack · Web UI</text>
  <text x="76" y="262" class="sub">CLI · CI · Bots</text>
  <text x="76" y="287" class="tiny">No direct DB / sandbox access</text>

  <!-- gateway -->
  <rect x="320" y="205" width="150" height="105" rx="8" class="box-bg"/>
  <rect x="320" y="205" width="150" height="105" rx="8" class="frontend" filter="url(#glow)"/>
  <text x="352" y="235" class="label">Gateway</text>
  <text x="345" y="258" class="sub">Auth · REST · ACP</text>
  <text x="359" y="276" class="sub">SSE streaming</text>
  <text x="339" y="297" class="tiny">stateless edge</text>

  <!-- celld -->
  <rect x="690" y="205" width="170" height="125" rx="8" class="box-bg"/>
  <rect x="690" y="205" width="170" height="125" rx="8" class="backend"/>
  <text x="748" y="234" class="label">Celld</text>
  <text x="711" y="257" class="sub">systemd session cells</text>
  <text x="718" y="275" class="sub">Go Runtime + Pi</text>
  <text x="712" y="293" class="sub">DB plane on host</text>
  <text x="711" y="315" class="tiny">reconstructs from events</text>

  <!-- broker -->
  <rect x="610" y="390" width="180" height="105" rx="8" class="box-bg"/>
  <rect x="610" y="390" width="180" height="105" rx="8" class="backend"/>
  <text x="671" y="420" class="label">Broker</text>
  <text x="631" y="443" class="sub">registries · placement</text>
  <text x="631" y="461" class="sub">writes session leases</text>
  <text x="635" y="483" class="tiny">not in data path</text>

  <!-- postgres -->
  <rect x="895" y="185" width="170" height="105" rx="8" class="box-bg"/>
  <rect x="895" y="185" width="170" height="105" rx="8" class="db"/>
  <text x="944" y="215" class="label">Postgres</text>
  <text x="920" y="238" class="sub">sessions · events</text>
  <text x="917" y="256" class="sub">command_inbox</text>
  <text x="913" y="274" class="sub">leases · hosts</text>

  <!-- sandboxd -->
  <rect x="1020" y="230" width="170" height="115" rx="8" class="box-bg"/>
  <rect x="1020" y="230" width="170" height="115" rx="8" class="cloud"/>
  <text x="1070" y="260" class="label">Sandboxd</text>
  <text x="1043" y="283" class="sub">nspawn + BTRFS</text>
  <text x="1043" y="301" class="sub">nsenter tool exec</text>
  <text x="1042" y="324" class="tiny">no agent code / tokens</text>

  <!-- credentials proxy -->
  <rect x="860" y="410" width="155" height="90" rx="8" class="box-bg"/>
  <rect x="860" y="410" width="155" height="90" rx="8" class="security"/>
  <text x="887" y="438" class="label">Creds Proxy</text>
  <text x="882" y="462" class="sub">session JWT exchange</text>
  <text x="895" y="481" class="tiny">audit every token</text>

  <!-- gitd -->
  <rect x="1035" y="450" width="145" height="75" rx="8" class="box-bg"/>
  <rect x="1035" y="450" width="145" height="75" rx="8" class="cloud"/>
  <text x="1090" y="480" class="label">gitd</text>
  <text x="1056" y="503" class="sub">shared git objects</text>

  <!-- gcs -->
  <rect x="1045" y="560" width="140" height="70" rx="8" class="box-bg"/>
  <rect x="1045" y="560" width="140" height="70" rx="8" class="cloud"/>
  <text x="1100" y="590" class="label">GCS</text>
  <text x="1070" y="613" class="sub">snapshot bucket</text>

  <!-- local mvp note -->
  <rect x="55" y="555" width="370" height="75" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="75" y="583" class="label">Local MVP</text>
  <text x="75" y="606" class="sub">SQLite + in-process daemon references demonstrate the same invariants.</text>

  <!-- legend -->
  <g transform="translate(48 700)">
    <rect width="14" height="14" rx="3" class="frontend"/><text x="22" y="11" class="legend">Gateway / edge</text>
    <rect x="150" width="14" height="14" rx="3" class="backend"/><text x="172" y="11" class="legend">Control + runtime</text>
    <rect x="340" width="14" height="14" rx="3" class="db"/><text x="362" y="11" class="legend">Durable store</text>
    <rect x="505" width="14" height="14" rx="3" class="cloud"/><text x="527" y="11" class="legend">Sandbox/cloud services</text>
    <rect x="735" width="14" height="14" rx="3" class="security"/><text x="757" y="11" class="legend">Security boundary</text>
    <line x1="930" y1="7" x2="970" y2="7" class="green dash" marker-end="url(#arrow-green)"/><text x="980" y="11" class="legend">control plane</text>
  </g>
</svg>
